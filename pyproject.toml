[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calmanta-personal"
version = "0.1.0"
description = "Local, approval-first companion for Calmanta"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
calmanta-personal = "calmanta_personal.cli:main"

[tool.setuptools.packages.find]
include = ["calmanta_personal*"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "S"]

